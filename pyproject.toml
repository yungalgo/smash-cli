[project]
name = "smash-cli"
version = "0.1.0"
description = "Run Kentskooking's MiniMax H3 context smashing workflow on a rented RunPod GPU"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["requests>=2.31"]

[project.scripts]
smash-cli = "smash_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["smash_cli.py", "pod", "vendor"]
